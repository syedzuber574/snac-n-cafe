<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0">

    <title>Admin Login</title>

</head>

<body
style="
font-family:Arial;
background:#fff8ef;
padding:30px;">

    <div
    style="
    max-width:400px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 6px 20px rgba(0,0,0,0.1);
    text-align:center;">

        <h1 style="color:red;">
            🍔 Snac N Cafe
        </h1>

        <h2>
            Admin Login
        </h2>

        {% if error %}

        <p style="color:red;">
            {{ error }}
        </p>

        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
                style="
                width:100%;
                padding:15px;
                margin-bottom:15px;
                border-radius:10px;
                border:1px solid #ddd;">

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
                style="
                width:100%;
                padding:15px;
                margin-bottom:15px;
                border-radius:10px;
                border:1px solid #ddd;">

            <button
                type="submit"
                style="
                width:100%;
                padding:15px;
                background:red;
                color:white;
                border:none;
                border-radius:10px;
                cursor:pointer;">

                Login

            </button>

        </form>

    </div>

</body>
</html>
