<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Snac N Cafe</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

    <script src="{{ url_for('static',
    filename='js/script.js') }}"></script>
</head>

<body>

    <!-- Header -->
    <header class="header">

        <h1>Checkout</h1>

    </header>

    <!-- Back -->
    <div style="padding:15px;">

        <a href="/cart"
           style="
           text-decoration:none;
           color:red;
           font-size:18px;
           font-weight:bold;">

            ← Back

        </a>

    </div>

    <!-- Form -->
    <section style="padding:15px;">

        <input
            type="text"
            id="customer-name"
            placeholder="Enter Name"
            style="
            width:100%;
            padding:15px;
            border:2px solid red;
            border-radius:10px;
            margin-bottom:15px;
            box-sizing:border-box;">

        <input
            type="text"
            id="customer-phone"
            placeholder="Enter Phone Number"
            style="
            width:100%;
            padding:15px;
            border:2px solid red;
            border-radius:10px;
            margin-bottom:15px;
            box-sizing:border-box;">

        <textarea
            id="customer-address"
            placeholder="Enter Address"
            style="
            width:100%;
            height:120px;
            padding:15px;
            border:2px solid red;
            border-radius:10px;
            margin-bottom:15px;
            box-sizing:border-box;"></textarea>

        <button
            onclick="sendWhatsAppOrder()"
            style="
            width:100%;
            background:green;
            color:white;
            border:none;
            padding:15px;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;">

            Order on WhatsApp

        </button>

    </section>

</body>
</html>
