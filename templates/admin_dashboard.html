<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0">

    <title>
        Admin Dashboard
    </title>

    <link rel="stylesheet"
          href="{{ url_for(
          'static',
          filename='css/style.css'
          ) }}">

</head>

<body style="
font-family:Arial;
background:#fff8ef;
padding:20px;">

    <h1 style="

    color:red;">

        🍔 Snac N Cafe

        Admin Dashboard

    <div style="

        <!-- ADD ITEM -->

        <a href="/admin-add-item">

            <button style="
            width:100%;
            padding:18px;
            margin-bottom:15px;
            background:red;
            color:white;
            border:none;
            border-radius:12px;
            font-size:18px;
            cursor:pointer;">

                ➕ Add Item

            </button>

        </a>

        <!-- MANAGE ITEMS -->

        <a href="/manage-items">

            <button style="
            width:100%;
            padding:18px;
            margin-bottom:15px;

            border-radius:12px;
            font-size:18px;
            cursor:pointer;">

            </button>

        </a>

        <a href="/orders">

            <button style="
            width:100%;
            padding:18px;
            margin-bottom:15px;
            background:green;
            color:white;
            border:none;
            border-radius:12px;
            font-size:18px;
            cursor:pointer;">

                📦 Orders

            </button>

        </a>

        <!-- ANALYTICS -->

        <a href="/analytics">

            <button style="
            width:100%;
            padding:18px;

            border:none;
            border-radius:12px;
            font-size:18px;
            cursor:pointer;">

                📊 Analytics

            </button>

        </a>

        <!-- LOGOUT -->

        <a href="/logout">

            <button style="
            width:100%;
            padding:18px;
            background:#555;
            color:white;
            border:none;
            border-radius:12px;
            font-size:18px;
            cursor:pointer;">

                🚪 Logout

            </button>

        </a>

</html>
